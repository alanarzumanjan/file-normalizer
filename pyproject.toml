[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filenorm"
version = "1.3.1"
authors = [
    {name = "Alan Arzumanjan", email = "alanarzumanjan@gmail.com"}
]
description = "A simple utility to normalize file names"
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "unidecode"
]

[project.scripts]
filenorm = "filenorm.main:main"

[tool.setuptools.packages.find]
where = ["src"]
