[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filenorm"
version = "1.0.0"
authors = [{name = "Alan Arzumanjan"}]
description = "A simple utility to normalize file names"
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[project.scripts]
filenorm = "filenorm.main:main"

[tool.setuptools.packages.find]
where = ["src"]
